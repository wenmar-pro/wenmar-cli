version: 2

project_name: wenmar

before:
  hooks:
    - go mod tidy

builds:
  - id: wenmar
    main: ./cmd/wenmar
    binary: wenmar
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/wenmar-pro/wenmar-cli/cmd.version={{.Version}} -X github.com/wenmar-pro/wenmar-cli/cmd.commit={{.Commit}} -X github.com/wenmar-pro/wenmar-cli/cmd.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  draft: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
