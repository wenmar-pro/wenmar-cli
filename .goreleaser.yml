version: 2

project_name: wenmar

builds:
  - id: wenmar
    main: ./cmd/wenmar
    binary: wenmar
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/wenmar-pro/wenmar-cli/cmd.version={{.Version}} -X github.com/wenmar-pro/wenmar-cli/cmd.commit={{.Commit}} -X github.com/wenmar-pro/wenmar-cli/cmd.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Bundle the agent skill with every archive so `wenmar skill install`
    # works from installed binaries (was broken: the binary looked for
    # skills/wenmar/SKILL.md next to itself and released archives never
    # shipped it).
    files:
      - skills/wenmar/SKILL.md

sboms:
  - id: default
    artifacts: archive

nfpms:
  - id: packages
    package_name: wenmar
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
      - apk
    homepage: https://github.com/Wenmar-Pro/wenmar-cli
    description: Wenmar Pro automotive shop management CLI
    maintainer: Wenmar Pro <support@wenmarpro.com>
    license: MIT
    contents:
      - src: skills/wenmar/SKILL.md
        dst: /usr/share/wenmar/skills/wenmar/SKILL.md

checksum:
  name_template: "checksums.txt"

signs:
  - id: cosign
    cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - --bundle
      - "${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

homebrew_casks:
  - name: wenmar
    repository:
      owner: wenmar-pro
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/wenmar-pro/wenmar-cli
    description: Wenmar Pro automotive shop management CLI
    license: MIT
    binaries:
      - wenmar
    commit_author:
      name: wenmar-release-bot
      email: support@wenmarpro.com

scoops:
  - name: wenmar
    repository:
      owner: wenmar-pro
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/wenmar-pro/wenmar-cli
    description: Wenmar Pro automotive shop management CLI
    license: MIT
    commit_author:
      name: wenmar-release-bot
      email: support@wenmarpro.com

release:
  draft: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
