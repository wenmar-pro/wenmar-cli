name: CI

on:
  pull_request:
  push:
    branches: [main, master]

env:
  GOPRIVATE: github.com/Wenmar-Pro/*

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Configure Go module auth for private Wenmar repos
        if: ${{ env.GITHUB_TOKEN != '' }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/Wenmar-Pro/".insteadOf "https://github.com/Wenmar-Pro/"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o wenmar ./cmd/wenmar/

      - name: Test
        run: go test ./... -v

      - name: Verify CLI runs
        run: ./wenmar --help
