name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o wenmar ./cmd/wenmar/

      - name: Test
        run: go test ./... -v

      - name: Verify CLI runs
        run: ./wenmar --help
