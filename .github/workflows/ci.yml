name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GOPRIVATE: github.com/Wenmar-Pro/*

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Configure Go module auth for private Wenmar repos
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Wenmar-Pro/".insteadOf "https://github.com/Wenmar-Pro/"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd/ internal/)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o wenmar ./cmd/wenmar/

      - name: Test
        run: go test -race ./...

      - name: Verify CLI runs
        run: ./wenmar --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Configure Go module auth for private Wenmar repos
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Wenmar-Pro/".insteadOf "https://github.com/Wenmar-Pro/"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Vulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Configure Go module auth for private Wenmar repos
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Wenmar-Pro/".insteadOf "https://github.com/Wenmar-Pro/"
      - name: Download dependencies
        run: go mod download
      - name: Surface snapshot diff
        run: make surface-diff
      - name: Shellcheck install script
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install-cli
