groups:
  workorders:
    short: Manage work orders
    aliases: [work_orders, wo]
  servicecategories:
    short: Manage service categories
    aliases: [service-categories, sc]
  customers:
    short: Manage customers
  vehicles:
    short: Manage vehicles
  drivers:
    short: Manage drivers
  vendors:
    short: Manage vendors
  statements:
    short: Manage statements
  locations:
    short: Show location details
  account:
    short: Show the current account
  customertags:
    short: Manage customer tags
  workordertags:
    short: Manage work order tags

commands:
  # account
  list_account:
    resource: account
    command: show
    summary: Show account details
    method: ListAccount
    example: |
      wenmar account show

  # vendors
  list_vendors:
    resource: vendors
    command: list
    summary: List all vendors, paginated via the Link header
    method: ListVendors
    example: |
      wenmar vendors list
  show_vendor:
    resource: vendors
    command: show
    summary: Show a single vendor by ID
    method: ShowVendor
    example: |
      wenmar vendors show 7
  trash_vendor:
    resource: vendors
    command: trash
    summary: "Soft-delete a vendor (status: trashed, purgeable after 30 days)"
    method: TrashVendor
  archive_vendor:
    resource: vendors
    command: archive
    summary: Archive a vendor (hidden from active lists, retained for history)
    method: ArchiveVendor
  restore_vendor:
    resource: vendors
    command: restore
    summary: Restore a vendor to active (from trashed or archived)
    method: RestoreVendor

  # locations
  show_location:
    resource: locations
    command: show
    summary: Show a location by ID
    method: ShowLocation
    example: |
      wenmar locations show main

  # statements — flag-based list (Decision A: customers statements <id> dropped)
  show_statement:
    resource: statements
    command: show
    summary: Show a single statement by ID
    method: ShowStatement
    example: |
      wenmar statements show 9001
  list_customers_statements:
    resource: statements
    command: list
    summary: List statements for a customer, paginated via the Link header
    method: ListCustomersStatements
    example: |
      wenmar statements list --customer-id 42

  # drivers — Decision B: --customer-id flag on all commands, no id_param
  list_customers_drivers:
    resource: drivers
    command: list
    summary: List drivers for a customer, paginated via the Link header
    method: ListCustomersDrivers
    example: |
      wenmar drivers list --customer-id 42
  show_driver:
    resource: drivers
    command: show
    summary: Show a single driver by ID
    method: ShowDriver
  create_driver:
    resource: drivers
    command: create
    summary: Create a new driver for a customer
    method: CreateDriver
    request_struct: CreateDriverRequest
  update_driver:
    resource: drivers
    command: update
    summary: Update a driver by ID
    method: UpdateDriver
    request_struct: UpdateDriverRequest
  delete_driver:
    resource: drivers
    command: delete
    summary: Delete a driver by ID
    method: DeleteDriver

  # customers
  list_customers:
    resource: customers
    command: list
    summary: List all customers, paginated via the Link header
    method: ListCustomers
    query_param_struct: ListCustomersParams
    example: |
      wenmar customers list
      wenmar customers list --query "jane" --all
      wenmar customers list --agent | head -20
  show_customer:
    resource: customers
    command: show
    summary: Show a single customer by ID
    method: ShowCustomer
    example: |
      wenmar customers show 42
  merge_customer:
    resource: customers
    command: merge
    summary: Merge a source customer into this keeper
    method: MergeCustomer
    request_struct: MergeCustomerRequest
  lookup_customer:
    resource: customers
    command: lookup
    summary: Search customers by name/email/phone
    method: LookupCustomer
    positional_arg: string
    query_param_struct: LookupCustomerParams
    example: |
      wenmar customers lookup "jane doe"
  check_customer_duplicate:
    resource: customers
    command: duplicates
    summary: Check for duplicate customers
    method: CheckCustomerDuplicate
    query_param_struct: CheckCustomerDuplicateParams
  trash_customer:
    resource: customers
    command: trash
    summary: "Soft-delete a customer (status: trashed, purgeable after 30 days)"
    method: TrashCustomer
  archive_customer:
    resource: customers
    command: archive
    summary: Archive a customer (hidden from active lists, retained for history)
    method: ArchiveCustomer
  restore_customer:
    resource: customers
    command: restore
    summary: Restore a customer to active (from trashed or archived)
    method: RestoreCustomer
  list_customers_vehicles:
    resource: customers
    command: vehicles
    summary: List a customer's vehicles
    method: ListCustomersVehicles
    id_param: customer_id
  list_customers_work_orders:
    resource: customers
    command: workorders
    summary: List a customer's work orders
    method: ListCustomersWorkOrders
    id_param: customer_id
    aliases: [work-orders]
  create_customers_export:
    resource: customers
    command: export
    summary: Request a customer export
    method: CreateCustomersExport
    request_struct: CreateCustomersExportRequest
  list_customers_export_download:
    resource: customers
    command: download
    summary: Download a customer export by ID
    method: ListCustomersExportDownload
    response_field: Body

  # vehicles
  list_vehicles:
    resource: vehicles
    command: list
    summary: List all vehicles
    method: ListVehicles
    paginated: false
    query_param_struct: ListVehiclesParams
    example: |
      wenmar vehicles list
      wenmar vehicles list --jq '.[].plate'
  show_vehicle:
    resource: vehicles
    command: show
    summary: Show a single vehicle by ID
    method: ShowVehicle
    example: |
      wenmar vehicles show 5
  update_vehicle:
    resource: vehicles
    command: update
    summary: Update a vehicle by ID
    method: UpdateVehicle
    request_struct: UpdateVehicleRequest
  trash_vehicle:
    resource: vehicles
    command: trash
    summary: "Soft-delete a vehicle (status: trashed, purgeable after 30 days)"
    method: TrashVehicle
  archive_vehicle:
    resource: vehicles
    command: archive
    summary: Archive a vehicle (hidden from active lists, retained for history)
    method: ArchiveVehicle
  restore_vehicle:
    resource: vehicles
    command: restore
    summary: Restore a vehicle to active (from trashed or archived)
    method: RestoreVehicle
  decode_vin:
    resource: vehicles
    command: decode-vin
    summary: Decode a VIN into make/model
    method: DecodeVin
    positional_arg: string
    query_param_struct: DecodeVinParams
    example: |
      wenmar vehicles decode-vin 1HGCM82633A004352
  check_vehicle_duplicate:
    resource: vehicles
    command: duplicates
    summary: Check for duplicate vehicles matching a VIN
    method: CheckVehicleDuplicate
    positional_arg: string
    query_param_struct: CheckVehicleDuplicateParams
  transfer_vehicle:
    resource: vehicles
    command: transfer
    summary: Transfer a vehicle to a new customer
    method: TransferVehicle
    request_struct: TransferVehicleRequest
  merge_vehicle:
    resource: vehicles
    command: merge
    summary: Merge a source vehicle into this keeper
    method: MergeVehicle
    request_struct: MergeVehicleRequest
  prefill_vehicle:
    resource: vehicles
    command: prefill
    summary: Prefill vehicle data from a VIN
    method: PrefillVehicle
    query_param_struct: PrefillVehicleParams
  lookup_vehicle:
    resource: vehicles
    command: lookup
    summary: Search vehicles by make/model/plate/vin
    method: LookupVehicle
    positional_arg: string
    query_param_struct: LookupVehicleParams
  list_vehicles_work_orders:
    resource: vehicles
    command: workorders
    summary: List a vehicle's work orders
    method: ListVehiclesWorkOrders
    id_param: vehicle_id
    aliases: [work-orders]

  # work orders (resource renamed per D2; aliases preserve work_orders/wo)
  list_work_orders:
    resource: workorders
    command: list
    summary: List all work orders, paginated via the Link header
    method: ListWorkOrders
    example: |
      wenmar workorders list
      wenmar workorders list --jq '.[].number'
      wenmar workorders list --jq 'length'
  create_work_order:
    resource: workorders
    command: create
    summary: Create a new work order
    method: CreateWorkOrder
    request_struct: CreateWorkOrderRequest
    example: |
      wenmar workorders create --customer-id 42 --vehicle-id 5
  update_work_order:
    resource: workorders
    command: update
    summary: Update a work order by ID
    method: UpdateWorkOrder
    request_struct: UpdateWorkOrderRequest
    example: |
      wenmar workorders update 100 --intake-method drop_off
  delete_work_order:
    resource: workorders
    command: delete
    summary: Delete a work order by ID
    method: DeleteWorkOrder
    example: |
      wenmar workorders delete 100 --dry-run

  # service categories (resource renamed per D2)
  list_service_categories:
    resource: servicecategories
    command: list
    summary: List all service categories
    method: ListServiceCategories
    example: |
      wenmar servicecategories list
  create_service_category:
    resource: servicecategories
    command: create
    summary: Create a new service category
    method: CreateServiceCategory
    request_struct: CreateServiceCategoryRequest
  update_service_category:
    resource: servicecategories
    command: update
    summary: Update a service category by ID
    method: UpdateServiceCategory
    request_struct: UpdateServiceCategoryRequest
  trash_service_category:
    resource: servicecategories
    command: trash
    summary: "Soft-delete a service category (status: trashed, purgeable after 30 days)"
    method: TrashServiceCategory
  archive_service_category:
    resource: servicecategories
    command: archive
    summary: Archive a service category (hidden from active lists, retained for history)
    method: ArchiveServiceCategory
  restore_service_category:
    resource: servicecategories
    command: restore
    summary: Restore a service category to active (from trashed or archived)
    method: RestoreServiceCategory
  seed_defaults_service_categories:
    resource: servicecategories
    command: seed-defaults
    summary: Seed default service categories for the account
    method: SeedDefaultsServiceCategories
    request_struct: SeedDefaultsServiceCategoriesRequest
    action_summary: Default service categories seeded.

  # customertags
  list_customer_tags:
    resource: customertags
    command: list
    summary: List all customer tags
    method: ListCustomerTags
