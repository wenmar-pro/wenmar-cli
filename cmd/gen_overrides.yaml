# gen_overrides.yaml maps OpenAPI operations to CLI command names.
# Hand-maintained — the generator reads it to produce ergonomic command
# names and groupings. Verified against wenmar-sdk go/v0.6.0 (method
# signatures in wenmar/operations.gen.go).
#
# Exclusion taxonomy:
#   - companions: commands whose flag/parse logic is not per-op derivable
#     (customer splitName/email/phone parsing, vehicle pointer bodies,
#     work-order tab truncation, tech assignments) — owned by
#     cmd/customers_extras.go, cmd/vehicles_extras.go, cmd/wo_extras.go,
#     cmd/wo_technicians.go
#   - no CLI surface: work-order lifecycle/auth/history ops the CLI has
#     never exposed (SDK 0.4.1 has methods; surface predates them)
#   - not exposed: delete_customer, list_team, vehicle history

