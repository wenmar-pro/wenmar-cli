# NOTE: operations in `exclude:` must not also appear under `commands:` —
# exclusion takes precedence and the entry would be dead.

# Flag overrides: map request body fields to flag names with help text.
# Fields not listed here auto-derive from the property name (snake_case -> kebab-case).
# `required: false` un-marks a spec-required field; `default` sets a flag default;
# `suppress: true` hides a field from the CLI surface.
flag_overrides:
  list_customers:
    customer_tag_id:
      flag: tag-id
      help: Filter by customer tag ID
  merge_customer:
    source_customer_id:
      flag: source-id
      help: Source customer ID to merge into keeper (required)
  merge_vehicle:
    source_vehicle_id:
      flag: source-id
      help: Source vehicle ID (required)
  transfer_vehicle:
    mode:
      required: false
      default: vehicle_only
      help: Transfer mode (vehicle_only, vehicle_and_history, everything)
  create_driver:
    driver.phone:
      required: false
      help: Driver phone
  update_driver:
    driver.full_name:
      required: false
      help: Driver full name
  create_service_category:
    service_category.icon:
      required: false
      default: wrench
      help: Icon (wrench, disc, engine, etc.)
    service_category.service_type:
      required: false
      default: maintenance
      help: Service type (maintenance, repair, diagnostic, recall, sublet)
  update_work_order:
    work_order.intake_method:
      required: false
      help: Intake method (e.g. drop_off, walk_in)
  create_work_order:
    work_order.customer_id:
      required: true
      help: Customer ID
    work_order.vehicle_id:
      required: true
      help: Vehicle ID
