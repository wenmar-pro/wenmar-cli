# Flag overrides: map request body fields to flag names with help text.
# Fields not listed here auto-derive from the property name (snake_case -> kebab-case).
# `required: false` un-marks a spec-required field; `default` sets a flag default;
# `suppress: true` hides a field from the CLI surface.
