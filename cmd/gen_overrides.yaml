# gen_overrides.yaml maps OpenAPI operations to CLI command names.
# Hand-maintained — the generator reads it to produce ergonomic command
# names and groupings. Verified against wenmar-sdk go/v0.4.1 (method
# signatures in wenmar/operations.gen.go).
#
# Exclusion taxonomy:
#   - companions: commands whose flag/parse logic is not per-op derivable
#     (tags type-branching, customer splitName/email/phone parsing,
#     work-order tab truncation) — owned by cmd/tags.go,
#     cmd/customers_extras.go, cmd/work_orders_extras.go
#   - no CLI surface: work-order lifecycle/auth/history ops the CLI has
#     never exposed (SDK 0.4.1 has methods; surface predates them)
#   - not exposed: delete_customer, list_team, vehicle history

exclude:
  # companions — customers
  - create_customer
  - update_customer
  # companions — vehicles (pointer-typed wrapper bodies with omitempty)
  - create_vehicle
  - update_vehicle
  # companions — tags (all tag ops live in cmd/tags.go)
  - create_customer_tag
  - create_vehicle_tag
  - update_tags
  - list_tags
  - list_customer_tags
  - list_vehicle_tags
  - delete_customer_tag
  - delete_vehicle_tag
  - update_customer_tag
  - update_vehicle_tag
  # companions — work orders show/tabs
  - show_work_order
  - show_work_order_estimate
  - show_work_order_wip
  - show_work_order_inspection
  - show_work_order_parts
  - show_work_order_payments
  # work-order lifecycle/auth/history — no CLI surface
