  list_customers:
    customer_tag_id:
      flag: tag-id
      help: Filter by customer tag ID
  merge_customer:
    source_customer_id:
      flag: source-id
      help: Source customer ID to merge into keeper (required)
  merge_vehicle:
    source_vehicle_id:
      flag: source-id
      help: Source vehicle ID (required)
  transfer_vehicle:
    mode:
      required: false
